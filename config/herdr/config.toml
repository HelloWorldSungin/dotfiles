onboarding = false
# Herdr configuration - ~/.config/herdr/config.toml is a symlink to this file.
#
# Starting from an empty config = herdr defaults (prefix key ctrl+b, tmux-like).
# To see every available option with its default value, run:
#   herdr --default-config
# and copy the sections you want to change into this file.
#
# After editing, apply without restarting sessions:
#   herdr server reload-config

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
# Bright accent color for space/agent selection highlights, borders, and sidebar
accent = "cyan"

[keys]
# Move remote image paste to ctrl+alt+v so ctrl+shift+v stays free for text paste
remote_image_paste = "ctrl+alt+v"

# Custom split pane shortcuts (prefix Ctrl+b, then key)
split_vertical = "prefix+v"
split_horizontal = "prefix+-"

[ui.toast]
delivery = "system"
